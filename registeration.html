<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #333333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .info-group {
            margin-bottom: 15px;
        }
        .label {
            font-weight: bold;
            color: #555555;
            display: block;
            margin-bottom: 3px;
        }
        .value {
            color: #222222;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Event Registration Details</h2>
        
        <div class="info-group">
            <span class="label">College Name:</span>
            <span class="value">Lovely Professional University</span>
        </div>

        <div class="info-group">
            <span class="label">Event Name:</span>
            <span class="value">Tech Fest 2026</span>
        </div>

        <div class="info-group">
            <span class="label">Event Date:</span>
            <span class="value">October 25, 2026</span>
        </div>

        <div class="info-group">
            <span class="label">Registration Number:</span>
            <span class="value">REG-12345678</span>
        </div>
    </div>

</body>
</html>
